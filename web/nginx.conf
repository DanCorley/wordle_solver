server {
  listen 8501;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # The shell must revalidate so a deploy cannot point it at removed hashed assets.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Vite fingerprints asset names, so they can be cached forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Daily mode: serve a stored day, otherwise fetch it and keep the body.
  location ~ "^/api/wordle/(?<date>[0-9]{4}-[0-9]{2}-[0-9]{2})\.json$" {
    root /tmp/wordle-cache;
    try_files /$date.json @wordle;
    add_header Cache-Control "public, max-age=3600";
  }

  location @wordle {
    rewrite ^ /svc/wordle/v2/$date.json break;
    proxy_pass https://www.nytimes.com;
    proxy_ssl_server_name on;
    proxy_set_header Host www.nytimes.com;
    proxy_set_header User-Agent "Mozilla/5.0";
    proxy_set_header Accept "application/json";
    proxy_set_header Accept-Encoding "";
    proxy_hide_header Set-Cookie;
    proxy_hide_header Cache-Control;
    proxy_ignore_headers Set-Cookie Cache-Control Expires;
    proxy_store /tmp/wordle-cache/$date.json;
    proxy_store_access user:rw group:r all:r;
    add_header Cache-Control "public, max-age=3600";
  }
}
