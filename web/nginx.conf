proxy_cache_path /tmp/wordle-cache levels=1:2 keys_zone=wordle:10m max_size=10m inactive=1d use_temp_path=off;

server {
  listen 8501;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # The shell must revalidate so a deploy cannot point it at removed hashed assets.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Vite fingerprints asset names, so they can be cached forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Same-origin proxy for daily mode; the browser cannot read nytimes.com directly (CORS).
  location ~ "^/api/wordle/([0-9]{4}-[0-9]{2}-[0-9]{2})\.json$" {
    rewrite "^/api/wordle/([0-9]{4}-[0-9]{2}-[0-9]{2})\.json$" /svc/wordle/v2/$1.json break;
    proxy_pass https://www.nytimes.com;
    proxy_ssl_server_name on;
    proxy_set_header Host www.nytimes.com;
    proxy_set_header User-Agent "Mozilla/5.0";
    proxy_set_header Accept "application/json";
    proxy_hide_header Set-Cookie;
    proxy_hide_header Cache-Control;
    proxy_ignore_headers Set-Cookie Cache-Control Expires;
    proxy_cache wordle;
    proxy_cache_key "$uri";
    proxy_cache_valid 200 6h;
    proxy_cache_lock on;
    add_header Cache-Control "public, max-age=3600";
  }
}
